name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n sunshine-setup.sh
          find modules tests -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x -S warning

      - name: Test suite
        run: bash tests/run.sh

  bash-versions:
    name: bash ${{ matrix.bash }}
    runs-on: ubuntu-latest
    container:
      image: bash:${{ matrix.bash }}
    strategy:
      fail-fast: false
      matrix:
        bash: ["4.4", "5.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: >
          apt-get update &&
          apt-get install -y --no-install-recommends
          jq coreutils findutils grep sed mawk

      - name: Test suite
        run: bash tests/run.sh

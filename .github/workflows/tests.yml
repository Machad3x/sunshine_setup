name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n sunshine-setup.sh
          find modules tests -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x -S warning

      - name: Test suite
        run: bash tests/run.sh
